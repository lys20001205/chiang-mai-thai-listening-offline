<header><a href="./index.html">← 原课程、词卡和价格速查</a><h1>清迈出发前 · 速成练习</h1><p>先确认金额和条件，再决定行动。听不清时，请对方写数字或在地图上指出位置。</p><nav id="nav" aria-label="速成练习导航"></nav><p id="audio-status" class="status" role="status"></p><p id="offline-status" class="status" role="status">尚未确认离线缓存；请在实际携带的设备上测试。</p></header>

<footer><p class="muted">本页是新增训练，不取代原有 150 张词卡和 36 条标牌。金额及对话均为练习设定，不是商家报价。</p><p class="muted">语音仅为设备本地标准泰语合成。没有真人连读、泰式英语或泰北话录音；这些听力能力仍待验证。</p><a href="./practice.html" download="chiang-mai-practice.html">另存本页单文件备份</a> · <a href="#sources">查看来源、勘误与待核对事项</a><p id="storage-status" class="status" role="status"></p></footer>

let progress={attempts:[],days:[]},storageOK=true;
try{const x=JSON.parse(localStorage.getItem(STORE)||"null");if(x&&typeof x==="object"){progress.attempts=Array.isArray(x.attempts)?x.attempts.filter(a=>a&&["money","negative","confirm","signs"].includes(a.kind)&&["text","audio","assisted","visual"].includes(a.mode)&&typeof a.correct==="boolean").slice(-100):[];progress.days=Array.isArray(x.days)?x.days.filter(n=>[1,2,3].includes(n)):[];}}catch(_){storageOK=false}
let state={page:"plan",mode:"text",q:null,result:null,heard:false,audioError:"",help:-1,stage:0},voice=null,speechToken=0;
const app=document.getElementById("app");
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function sourceLink(id){const x=SOURCE[id];return x?`<a href="${x[1]}" target="_blank" rel="noopener noreferrer">${esc(x[0])}</a>`:"<span class=muted>词汇复用原课程；新增情境为自编练习，未经过真人语流核听。</span>";}
function save(){try{localStorage.setItem(STORE,JSON.stringify(progress));storageOK=true;}catch(_){storageOK=false;}storageStatus();}
function storageStatus(){document.getElementById("storage-status").textContent=storageOK?"新练习进度仅保存在本机；不会改动原版学习记录。":"本机进度无法保存。当前仍可练习，但刷新可能丢失记录。";}
function record(correct,mode){progress.attempts.push({kind:state.page,id:state.q.id,correct,mode,at:new Date().toISOString()});progress.attempts=progress.attempts.slice(-100);save();}
function stopSpeech(){speechToken++;if(window.speechSynthesis)window.speechSynthesis.cancel();}
function refreshVoice(){voice=window.speechSynthesis?window.speechSynthesis.getVoices().find(v=>/^th(?:-|$)/i.test(v.lang)&&v.localService===true)||null:null;document.getElementById("audio-status").textContent=voice?`本机标准泰语合成：${voice.name}。这不是自然对话录音。`:"未检测到本地泰语语音：文字练习可用，听音入口禁用，不记作听力通过。";if(["money","negative"].includes(state.page)&&!state.result)render();}
function play(slow){if(!voice||!state.q)return;stopSpeech();const token=speechToken;state.heard=false;state.audioError="";const u=new SpeechSynthesisUtterance(state.q.th);u.voice=voice;u.lang=voice.lang;u.rate=slow?.75:1;u.onend=()=>{if(token!==speechToken)return;state.heard=true;const m=document.getElementById("play-note");if(m)m.textContent="播放结束。实际没听到或仍不确定，请选择“没听清／先确认”。";};u.onerror=e=>{if(token!==speechToken||["canceled","interrupted"].includes(e.error))return;state.heard=false;state.audioError="播放失败；本题未验证听音。可切换文字练习，或先确认。";const m=document.getElementById("play-note");if(m)m.textContent=state.audioError;};try{window.speechSynthesis.speak(u);}catch(_){state.audioError="播放失败；请切换文字练习。";document.getElementById("play-note").textContent=state.audioError;}}
function audioPanel(){if(state.mode!=="audio")return "";return `<div class=row><button data-play="normal" ${voice?"":"disabled"}>播放标准泰语</button><button data-play="slow" ${voice?"":"disabled"}>慢速再听</button></div><p id=play-note class=status role=status>${esc(state.audioError||"听完后作答；声音无法播放时不计为听音完成。")}</p>`;}
function modePanel(){return `<div class=row><button data-mode=text class="${state.mode==="text"?"primary":""}">文字练习</button><button data-mode=audio class="${state.mode==="audio"?"primary":""}" ${voice?"":"disabled"}>听音练习</button><button data-refresh>重新检测语音</button></div><p class=muted>两种模式分别记录。切换模式会开始新题，不把看过文字的题计为听力。</p>`;}
function setPage(page){stopSpeech();state.page=NAV.some(x=>x[0]===page)?page:"plan";state.q=null;state.result=null;state.help=-1;state.heard=false;state.audioError="";if(["money","negative","confirm","signs"].includes(state.page))newQuestion();else render();window.scrollTo(0,0);}
function newQuestion(){stopSpeech();state.result=null;state.heard=false;state.audioError="";if(state.page==="money"){const n=pick(NUMBERS),unit=pick(["person","total","unknown"]);state.q={id:`${n.n}-${unit}`,n:n.n,unit,th:(unit==="person"?"คนละ":unit==="total"?"ทั้งหมด":"")+n.th+"บาท",numberRoman:n.rom,source:"numbers"};}else if(state.page==="negative"){state.q={...pick(NEGATIVE)};}else if(state.page==="confirm"){state.q={...pick(CONFIRM)};}else if(state.page==="signs"){const s=pick(SIGNS);state.q={...s,id:s.th,layout:Math.floor(Math.random()*3)};}if(state.q&&state.q.options)state.q.options=shuffle(state.q.options);render();}
function render(){document.getElementById("nav").innerHTML=NAV.map(([id,label])=>`<a href="#${id}" ${state.page===id?'aria-current="page"':""}>${label}</a>`).join("");app.innerHTML=({plan:renderPlan,money:renderMoney,negative:renderNegative,confirm:renderConfirm,signs:renderSigns,dialect:renderDialect,sources:renderSources})[state.page]();storageStatus();}
function renderPlan(){const counts=Object.fromEntries(["text","audio","assisted","visual"].map(m=>[m,progress.attempts.filter(a=>a.mode===m).length]));return `<h2>按顺序练，先不追求背完词库</h2><p class=note>约 3 天 × 90 分钟。打勾只表示你完成了当天安排，不代表所有听力能力已验证。</p><section class=card><h3>第 1 天 · 金额、否定与确认</h3><p>20 分钟：练大字确认卡。45 分钟：金额、每人／总共、两人总额。25 分钟：否定词和句子顺序。</p><p><a href="#confirm">先学确认</a> → <a href="#money">金额训练</a> → <a href="#negative">否定训练</a></p>${dayCheck(1)}</section><section class=card><h3>第 2 天 · 看牌与接车</h3><p>40 分钟：原版 12 关词块教学，再做无提示认字。25 分钟：确认地点、等待时间、往返范围。25 分钟：有本地语音时练合成听音；无语音则继续文字练习，真人听力留待核验。</p><p><a href="./index.html">原版看字教学</a> → <a href="#signs">去提示认字</a> → <a href="#confirm">路线与接车情境</a></p>${dayCheck(2)}</section><section class=card><h3>第 3 天 · 混合练习与设备检查</h3><p>10 分钟：泰北话桥梁。20 分钟：收费分支情境。40 分钟：混合题和错项回看。20 分钟：在实际携带设备上验证音量、语音、飞行模式和两个页面之间的离线跳转。</p><p><a href="#dialect">泰北话桥梁</a> → <a href="#confirm">核对收费</a> → <a href="#sources">勘误与待核对</a></p>${dayCheck(3)}</section><section class=card><h3>最近 100 次练习记录</h3><p>文字 ${counts.text} 次 · 合成听音 ${counts.audio} 次 · 请求确认 ${counts.assisted} 次 · 无提示认字 ${counts.visual} 次。</p><p class=muted>记录的是练习行为，不是旅行安全或真人听力认证。请求确认的题不会同时记作独立听懂。</p><p>待复习：${progress.attempts.filter(x=>!x.correct&&x.mode!=="assisted").length} 次错答。每题反馈保留了正确内容与理由。</p></section>`;}
function dayCheck(n){return `<label><input type=checkbox data-day="${n}" ${progress.days.includes(n)?"checked":""}> 我已完成第 ${n} 天安排</label>`;}
function promptText(){return state.mode==="audio"&&!state.result?"<p class=thai>♪ 先听声音</p>":`<p class=thai lang=th>${esc(state.q.th)}</p>`;}
function renderMoney(){const q=state.q;return `<h2>金额、单位、两人总额</h2>${modePanel()}<details class=card><summary>先看数字规则与例子</summary><p><span lang=th>ศูนย์</span>（sǔun）是零；11 是 <span lang=th>สิบเอ็ด</span>（sìp èt），21 是 <span lang=th>ยี่สิบเอ็ด</span>（yîi sìp èt）。</p><p>优先区分 50、150、500、1,500。<span lang=th>คนละ</span> 表示每人；<span lang=th>ทั้งหมด</span> 表示总共；<span lang=th>บาท</span> 是泰铢。只听到金额时，单位仍未说明。</p><p>报价有时省略百位前的“一”。本轮先用完整形式；自然快读仍待真人录音。</p>${sourceLink("numbers")}<br>${sourceLink("restaurant")}</details><section class=card><span class=tag>${state.mode==="audio"?"合成听音":"文字理解"}</span><p>情境：你们两个人问价。对方只说了下面这些信息；没有说明往返和包含项目。</p>${promptText()}${audioPanel()}${state.result?renderResult():`<form id=money-form><label>听到／看到的金额（泰铢）<input name=amount type=text inputmode=numeric autocomplete=off required placeholder="例如 150"></label><label>这笔金额指什么？<select name=unit required><option value="">请选择</option><option value=person>每人</option><option value=total>两人总共</option><option value=unknown>没有说清，需要确认</option></select></label><label>两人总额<input name=total type=text inputmode=numeric autocomplete=off placeholder="能计算时填数字"></label><label><input type=checkbox name=unknown> 目前不能确定两人总额</label><button class="primary full" type=submit>核对答案</button><p id=form-error role=alert></p></form><button class=full data-assist>没听清／先确认，不猜金额</button>`}</section>`;}
function parseAmount(x){const s=String(x).normalize("NFKC").trim().replace(/[๐-๙]/g,c=>String(c.charCodeAt(0)-3664));if(!/^(?:\d{1,6}|\d{1,3}(?:,\d{3})+)$/.test(s))return NaN;return Number(s.replace(/,/g,""));}
function submitMoney(form){if(state.result)return;if(state.mode==="audio"&&!state.heard){document.getElementById("form-error").textContent="请先完成一次播放；未听到声音时选择确认或切换文字练习。";return;}const d=new FormData(form),amount=parseAmount(d.get("amount")),unit=d.get("unit"),unknown=d.has("unknown"),total=parseAmount(d.get("total"));if(!Number.isFinite(amount)||!unit||(!unknown&&!Number.isFinite(total))){document.getElementById("form-error").textContent="请填写完整数字、选择单位；无法确定总额时勾选下方选项。";return;}const q=state.q,expected=q.unit==="person"?q.n*2:q.unit==="total"?q.n:null;const correct=amount===q.n&&unit===q.unit&&(expected===null?unknown:!unknown&&total===expected);state.result={correct,assisted:false,answer:`金额 ${q.n} 泰铢；${q.unit==="person"?"每人":""}${q.unit==="total"?"两人总共":""}${q.unit==="unknown"?"单位尚未说明":""}；两人总额${expected===null?"待确认":expected+" 泰铢"}。`,why:"即使金额和单位都答对，也还没确认单程／往返及包含项目。数字转写："+q.numberRoman};record(correct,state.mode);render();}
function renderNegative(){return `<h2>否定词与顺序</h2>${modePanel()}<p class=note>先听完，再确定否定了什么。可以／不能的独立回答，与“没去／去不了”的整句要分别练。</p><section class=card>${promptText()}${audioPanel()}${state.result?renderResult():choices()+`<button class=full data-assist>没听清／先确认</button><p id=form-error role=alert></p>`}</section>`;}
function choices(){return state.q.options.map((o,i)=>`<button class=choice data-answer="${i}">${esc(o)}</button>`).join("");}
function renderResult(){const r=state.result,q=state.q;return `<div class="feedback ${r.correct||r.assisted?"":"wrong"}" role=status><strong>${r.assisted?"已选择确认；不计作独立听懂":r.correct?"判断正确":"这题需要复习"}</strong><p>${esc(r.answer||q.answer||q.zh)}</p><p>${esc(r.why||q.why||"")}</p></div>${q.english?`<div class=help-card><p class=english lang=en>${esc(q.english)}</p></div>`:""}${state.page==="money"?sourceLink("numbers"):q.source?sourceLink(q.source):""}<button class="primary full" data-next>下一题</button>`;}
function answer(i){if(state.result)return;if(state.mode==="audio"&&state.page==="negative"&&!state.heard){document.getElementById("form-error").textContent="尚未完成声音播放；也可以选择先确认。";return;}const q=state.q,correct=q.options[i]===(q.answer||q.zh);state.result={correct,assisted:false};record(correct,state.page==="signs"?(state.stage===0?"text":"visual"):state.page==="confirm"?"text":state.mode);render();}
function assist(){if(state.result)return;state.result={correct:false,assisted:true,answer:"先让对方写数字或完整条件，再复述确认。",why:"本题没有验证你独立听懂了原话，因此只记录确认行为。"};record(false,"assisted");render();const help=document.createElement("div");help.className="help-card";help.innerHTML=`<p class=english lang=en>Please write the total price and what is included.</p><p>请写总价和包含项目。</p>`;app.appendChild(help);}
function renderConfirm(){return `<h2>听不清时，下一步做什么？</h2><p class=note>这些是书面情境判断；没有把英文系统语音当作泰式英语口音训练。</p><section class=card><h3>可直接给对方看的确认卡</h3><div class=row>${HELP.map((_,i)=>`<button data-help="${i}">${["说慢一点","写数字","每人／总共","包含项目","地图接车点","写接车时间"][i]}</button>`).join("")}</div>${state.help>=0?`<div class=help-card><p class=english lang=en>${esc(HELP[state.help])}</p><button data-help-close>收起</button></div>`:""}<p class=muted>顺序：请慢说 → 写数字 → 确认每人或总共 → 核对包含范围 → 地图定位 → 写时间。</p></section><section class=card><p>${esc(state.q.setup)}</p><p class=english lang=en>${esc(state.q.quote)}</p>${state.result?renderResult():choices()}</section>`;}
function renderSigns(){const q=state.q;return `<h2>从词块到无提示标牌</h2><p>第一步学词块；第二步去掉提示；第三步改变字重和布局。建议先完成原版 12 关。</p><div class=row>${["词块教学","去掉提示","改变布局"].map((s,i)=>`<button data-stage="${i}" class="${state.stage===i?"primary":""}">${s}</button>`).join("")}</div><p class=note>本页使用模拟文字，尚无已授权真实店招照片或内嵌多字体。字体可能由设备回退；不把字重变化称为跨字体训练通过。</p><section class=card>${state.stage===0?`<p>目标：${esc(q.zh)}</p><div>${q.chunks.map(c=>`<span class="chunk thai" lang=th>${esc(c)}</span>`).join("")}</div><p>${esc(q.why)}</p>`:""}<div class=board style="${state.stage===2?`border-radius:${q.layout*10}px;text-align:${["left","center","right"][q.layout]}`:""}"><span class=thai lang=th style="font-weight:${state.stage===2&&q.layout===0?400:800}">${esc(q.th)}</span></div>${state.result?renderResult():`<p>这块牌子表示什么？</p>${choices()}`}</section><p>${sourceLink("script")} · ${sourceLink("shops")}</p>`;}
function renderDialect(){return `<h2>泰北话：认出线索，再确认</h2><p>标准泰语、带地方口音的标准泰语、泰北话词汇需要区分。听到一个词不能判定说话者来自哪里。</p><section class=card><table><thead><tr><th>功能</th><th>标准泰语</th><th>泰北话线索</th></tr></thead><tbody><tr><td>否定</td><td lang=th>ไม่</td><td lang=th>บ่</td></tr><tr><td>市场</td><td lang=th>ตลาด</td><td lang=th>กาด</td></tr><tr><td>二十</td><td lang=th>ยี่สิบ</td><td lang=th>ซาว</td></tr><tr><td>礼貌／语气功能，非逐词对应</td><td lang=th>ค่ะ／ครับ</td><td lang=th>เจ้า</td></tr></tbody></table><p class=note>复用原第 8 课。具体清迈发音、带调拼音和自然语流待母语者核听；本页没有泰北话播放按钮，也不使用标准泰语合成代读。</p>${sourceLink("dialect")}</section><section class=card><h3>只做识别，不强迫自己开口</h3><p>遇到陌生报价词，先请对方写阿拉伯数字；遇到地方说法，切换标准泰语或英语。其余泰北词留在原课程速查，不要求三天内背完。</p></section>`;}
function renderSources(){return `<h2>勘误、来源与未完成项</h2><section class=card><h3>先记住这三处</h3><p><span lang=th>เก้า</span>（九）与 <span lang=th>ข้าว</span>（米饭）在标准泰语里都是降调；应比较送气等实际声音特征，不能记成“声调不同”。${sourceLink("tones")} · ${sourceLink("numbers")}</p><p><span lang=th>ครับ／ค่ะ</span> 可用于礼貌或在语境中肯定回答；听见一个礼貌词不等于对方已经确认所有交易条件。${sourceLink("polite")}</p><p><span lang=th>ไม่ได้ไป</span> 表示没有去；<span lang=th>ไปไม่ได้</span> 表示去不了。${sourceLink("negative")}</p></section><section class=card><h3>价格参照的核验边界</h3><p>原版十二项宽区间不是固定成交价。以下两项有官方产品示例来源，其余十项的当前范围待逐项核对。</p><p>2026-09-24 核查：Elephant Nature Park 有半日 2,500 泰铢的项目；Skyline 不同套餐有 2,250／2,450 泰铢起的报价。它们不证明整个市场的最低／最高价；出行时仍以对应项目的最新订单与公布条款为准。</p>${sourceLink("elephant")}<br>${sourceLink("skyline")}</section><section class=card><h3>明确待核对</h3><p>真人自然语速、连读、泰式英语口音和泰北话录音尚未加入。自编情境不是现场录音；合成语音未做母语者音质验收。真实招牌照片及跨字体识别也尚未完成。</p><p>新增数字转写依据所列数字规则组合；其余新练习不编造未核实的整句罗马拼音。原课程中的无调拼音仍只是近似提示。</p><p>浏览器完成播放不保证你实际听见声音；未听到时请选择“先确认”或文字模式。在 iPhone／手表上仍需亲自验证语音和飞行模式。</p></section><details class="card sources"><summary>全部新增核对来源</summary>${Object.keys(SOURCE).map(sourceLink).join("")}<p class=muted>链接只在你主动点击时打开；练习运行不依赖这些外部网站。</p></details>`;}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.mode){stopSpeech();state.mode=b.dataset.mode==="audio"&&voice?"audio":"text";newQuestion();}else if(b.dataset.play)play(b.dataset.play==="slow");else if(b.hasAttribute("data-refresh"))refreshVoice();else if(b.hasAttribute("data-next"))newQuestion();else if(b.dataset.answer!==undefined)answer(Number(b.dataset.answer));else if(b.hasAttribute("data-assist"))assist();else if(b.dataset.stage!==undefined){state.stage=Number(b.dataset.stage);newQuestion();}else if(b.dataset.help!==undefined){state.help=Number(b.dataset.help);render();}else if(b.hasAttribute("data-help-close")){state.help=-1;render();}});
document.addEventListener("submit",e=>{if(e.target.id==="money-form"){e.preventDefault();submitMoney(e.target);}});
document.addEventListener("change",e=>{if(e.target.dataset.day){const n=Number(e.target.dataset.day);progress.days=progress.days.filter(d=>d!==n);if(e.target.checked)progress.days.push(n);save();}});
window.addEventListener("hashchange",()=>setPage(location.hash.slice(1)));window.addEventListener("pagehide",stopSpeech);
setPage(location.hash.slice(1));if(window.speechSynthesis){window.speechSynthesis.addEventListener("voiceschanged",refreshVoice);}refreshVoice();
if((location.protocol==="https:"||["localhost","127.0.0.1"].includes(location.hostname))&&"serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(()=>navigator.serviceWorker.ready).then(()=>{document.getElementById("offline-status").textContent="离线程序已就绪。请开飞行模式测试本页及返回原课程；仅页面可用不代表语音也可用。";}).catch(()=>{document.getElementById("offline-status").textContent="离线缓存尚未确认；请联网重试，或另存本页备份。";});}else if(location.protocol==="file:"){document.getElementById("offline-status").textContent="本页为单文件备份；返回原课程需要另外保存 index.html。文件预览器可能不执行脚本。";}
</script>
</body>
