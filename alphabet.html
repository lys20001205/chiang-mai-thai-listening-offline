const RAW=[

["ฃ","ขวด","瓶","kho khuat","kh · 送气","ข","看 ข 上方轮廓多出的折齿；这个字已不用于通常的现代拼写。"],

["ฌ","เฌอ","树","cho choe","ch · 送气（/tɕʰ/）","ณ","较宽的复合轮廓；从左到右看圈和竖杆的相对位置。"],
["ญ","หญิง","女性","yo ying","y · 类似 yes 起音","ย","先看主体下面额外的下伸部分；比 ย 多了下部结构。"],

["ฐ","ฐาน","底座","tho than","th · 送气","ถ","下面还有一层下伸结构；和没有这层结构的 ถ 对照。"],

["ฒ","ผู้เฒ่า","老者","tho phuthao","th · 送气","ณ","观察较宽的内部结构与顶端转折；不把它压成一个简单拱形。"],
["ณ","เณร","沙弥","no nen","n","น","比 น 更宽、结构更多；从左右两边的圈和竖杆来区别。"],
["ด","เด็ก","儿童","do dek","d","ต","上方较圆顺；和 ต 顶部向下的凹口对比。"],

["บ","ใบไม้","树叶","bo baimai","b","ป","像有小头的 U；右侧竖杆较短，没有像 ป 那样高高伸出。"],
["ป","ปลา","鱼","po pla","p · 不送气","บ","右侧竖杆明显向上伸出；先用这个位置与 บ 区分。"],

["ฝ","ฝา","盖子","fo fa","f","ผ","右侧多出向上伸高的杆；别只看两字相似的底部。"],
["พ","พาน","托盘","pho phan","ph · 送气","ฟ","看中间的折谷和右侧竖杆高度；与 ฟ 的高杆对比。"],
["ฟ","ฟัน","牙齿","fo fan","f","พ","右侧竖杆更高；把它和 พ 放在同一基线上比较。"],
["ภ","สำเภา","帆船","pho samphao","ph · 送气","ถ","重点看底部小圈的位置和连线方向；与 ถ 对照。"],
["ม","ม้า","马","mo ma","m","น","先追踪两侧小圈之间下弯的连接；与 น 的底部转弯对照。"],
["ย","ยักษ์","巨人","yo yak","y · 类似 yes 起音","ญ","没有 ญ 那样伸到主体下方的一层；看主体内部的折弯。"],
["ร","เรือ","船","ro rua","r · 舌尖轻振","ว","较窄的上下弯曲轮廓；与 ว 较大的包围轮廓对照。"],
["ล","ลิง","猴子","lo ling","l","ส","先看顶部；没有 ส 那条斜伸出去的线。"],
["ว","แหวน","戒指","wo waen","w","ร","像带小圈的弯钩；沿包围部分观察，别认成较窄的 ร。"],
["ศ","ศาลา","亭子","so sala","s","ค","先找顶端额外伸出的线，再比较与 ค 相似的主体。"],
["ษ","ฤๅษี","隐士","so rusi","s","บ","先看右侧穿出的短线；不要只看与 บ 相似的下部。"],
["ส","เสือ","老虎","so sua","s","ล","顶端有一条斜伸的线；与没有这条线的 ล 对照。"],
["ห","หีบ","箱子","ho hip","h；特定组合中也可不单独发音","น","先看上部交接、向上伸出的线，再看下部；别只认小圈。"],
["ฬ","จุฬา","风筝","lo chula","l","พ","先看上方多出的弯折，再看较宽的主体。"],
["อ","อ่าง","盆","o ang","可作元音载体；也可参与元音组合","ฮ","看较完整的包围轮廓；上方没有 ฮ 的额外弯线。"],
["ฮ","นกฮูก","猫头鹰","ho nokhuk","h","อ","主体近似 อ，重点找上方多出的弯线。"]
];
const LETTERS=RAW.map(([id,name,mnemonic,roman,sound,other,hint])=>({id,glyph:id,name:id+" "+name,mnemonic,roman,sound,other,hint,type:"辅音",speech:id+"อ "+name,source:1}));

const HIGH_CLASS=new Set([..."ขฃฉฐถผฝศษสห"]), MID_CLASS=new Set([..."กจฎฏดตบปอ"]);
function classOf(id){return HIGH_CLASS.has(id)?"高类":MID_CLASS.has(id)?"中类":"低类";}
function classCss(id){return classOf(id)==="高类"?"class-high":classOf(id)==="中类"?"class-mid":"class-low";}
const FAMILIES=[
{id:"k",sound:"k · 不送气",ids:["ก"],kind:"plain",tip:"一个字：先把 ก 当作这一类的代表。"},
{id:"kh",sound:"kh · 送气 k",ids:["ข","ฃ","ค","ฅ","ฆ"],kind:"aspirate",tip:"词首都进入 kh 家族；ข/ฃ 是高类，ค/ฅ/ฆ 是低类。耳朵不用硬分这些字形。"},
{id:"ng",sound:"ng",ids:["ง"],kind:"sonorant",tip:"类似英语 sing 末尾的鼻音，但泰语可以出现在词首。"},
{id:"ch0",sound:"ch/j · 不送气 /tɕ/",ids:["จ"],kind:"plain",tip:"先和送气的 ฉ/ช/ฌ 分开听。"},
{id:"ch",sound:"ch · 送气 /tɕʰ/",ids:["ฉ","ช","ฌ"],kind:"aspirate",tip:"ฉ 是高类；ช/ฌ 是低类。词首音家族相同，拼写与声调类别不同。"},
{id:"s",sound:"s",ids:["ซ","ศ","ษ","ส"],kind:"aspirate",tip:"ซ 是低类；ศ/ษ/ส 是高类。现代词首都落入 s 家族。"},

{id:"d",sound:"d",ids:["ฎ","ด"],kind:"plain",tip:"两个字词首都读 d 类音；都属于中类。"},
{id:"t",sound:"t · 不送气",ids:["ฏ","ต"],kind:"plain",tip:"两个字词首同属不送气 t；都属于中类。"},
{id:"th",sound:"th · 送气 t",ids:["ฐ","ฑ","ฒ","ถ","ท","ธ"],kind:"aspirate",tip:"ฐ/ถ 高类；ฑ/ฒ/ท/ธ 低类。这里的 th 不是英语 think 的 th。"},
{id:"n",sound:"n",ids:["ณ","น"],kind:"sonorant",tip:"词首都进入 n 家族；都属于低类。"},
{id:"b",sound:"b",ids:["บ"],kind:"plain",tip:"一个字；词尾时会收成 p 类音。"},
{id:"p",sound:"p · 不送气",ids:["ป"],kind:"plain",tip:"先和送气 ph 家族分开听。"},
{id:"ph",sound:"ph · 送气 p",ids:["ผ","พ","ภ"],kind:"aspirate",tip:"ผ 高类；พ/ภ 低类。不要把 ph 读成两个音节。"},
{id:"f",sound:"f",ids:["ฝ","ฟ"],kind:"aspirate",tip:"ฝ 高类，ฟ 低类；词首同属 f 家族。"},
{id:"m",sound:"m",ids:["ม"],kind:"sonorant",tip:"一个字。"},
{id:"r",sound:"r",ids:["ร"],kind:"sonorant",tip:"一个字；词尾规则另算。"},
{id:"l",sound:"l",ids:["ล","ฬ"],kind:"sonorant",tip:"词首都进入 l 家族；都属于低类。"},
{id:"w",sound:"w",ids:["ว"],kind:"sonorant",tip:"一个字；在词尾还可参与元音/滑音。"},
{id:"h",sound:"h",ids:["ห","ฮ"],kind:"aspirate",tip:"ห 高类，ฮ 低类；词首同属 h 家族。"},

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function stop(){if(window.speechSynthesis)window.speechSynthesis.cancel();}
function refreshVoice(){voice=window.speechSynthesis?window.speechSynthesis.getVoices().find(v=>/^th(?:-|$)/i.test(v.lang)&&v.localService===true)||null:null;document.getElementById("audio").textContent=voice?"可用：设备本地标准泰语合成。字母名与整词分别播放；未核听真人发音。":"未检测到本地泰语语音。认字和组字可用；听音按钮禁用，不宣称已学会发音。";document.querySelectorAll("[data-say]").forEach(b=>b.disabled=!voice);}
function speak(text){if(!voice||!text)return;stop();try{const u=new SpeechSynthesisUtterance(text);u.voice=voice;u.lang=voice.lang;u.rate=.8;u.onerror=e=>{if(!["interrupted","canceled"].includes(e.error))document.getElementById("audio").textContent="播放失败；本页不把点播放视为发音通过。";};window.speechSynthesis.speak(u);}catch(_){document.getElementById("audio").textContent="播放失败；可继续文字认字。";}}

function renderStart(){return `<section class=card><span class=badge>最先学这个</span><h2>44 个辅音 ≠ 44 种声音</h2><div class=family-stats><div class=family-stat><b>44</b><small>辅音字形</small></div><div class=family-stat><b>21</b><small>词首声音家族</small></div><div class=family-stat><b>3</b><small>高／中／低类</small></div><div class=family-stat><b>6</b><small>主要词尾辅音音</small></div></div><p>很多字在现代标准泰语里词首听起来本来就一样，例如 <span class=thai>ข ค ฆ</span> 都进入 <b>kh</b> 家族，<span class=thai>ศ ษ ส ซ</span> 都进入 <b>s</b> 家族。你的任务不是硬从声音猜出具体拼写。</p><p class=family-rule><b>先听声音家族 → 再看字形 → 再记高／中／低类。</b>同音字的类别不同，会参与整词的声调规则。</p><button class="primary full" data-go="families">先看 21 个声音家族（推荐）</button></section><section class=card><h2>第 0 步：字、元音和小符号是什么？</h2><p>先看这一个辅音：<b class=thai>ก</b>。加东西后，位置可能变：</p><span class="thai intro-demo">ก → กา　กิ　กุ　ไก่</span><p>主体 ก 仍在。า 在右边，ิ 在上面，ุ 在下面；ไ 写在左侧。ไก่ 上方的 ่ 又是另一类：声调记号。</p><p class=note>本课先让你认得字形，不要求马上读出陌生词。没有大小写；元音的书写位置不等于发音先后。字母名里的“鸡”只是记名方法，<b>ก 本身不等于“鸡”</b>。</p><button class="primary full" data-deck="0">理解声音家族后：学 ก、ข、ค、ง 的字形</button></section><section class=card><h2>每次 4 个，学完再测</h2><p>建议先用 30–45 分钟走常用字母与位置教学，再用 15 分钟拆短词。其余辅音随时查，不要求一次背完 44 个。</p>${GROUPS.map((g,i)=>`<button class=lesson data-deck="${i}"><b>${esc(g.title)}</b><small>${g.ids.length} 张 · 遮住后认对 ${g.ids.filter(id=>progress.mastered.includes(id)).length}/${g.ids.length}</small></button>`).join("")}</section><section class=card><h2>学过字母后，再做这一步</h2><p>从 ก + า 到 กา，再学 ปิด、ทาง、ร้าน，最后才看入口／出口和开门／关门。</p><button class="primary full" data-go="build">进入逐字讲解与组字</button><p class=muted>浏览过 ${progress.seen.length} 张；无提示认对 ${progress.mastered.length} 个；完成组字 ${progress.built.length}/${WORDS.length} 个词。这些是练习记录，不是流利阅读证明。</p></section>`;}

function openItem(id){const d=LETTERS.some(x=>x.id===id)?44:45;state.deck=d;state.pos=(d===44?LETTERS:[...VOWELS,...MARKS]).findIndex(x=>x.id===id);go("learn");}
function renderLearn(){const ids=deckIds(),x=BY[ids[state.pos]],o=BY[x.other];if(!progress.seen.includes(x.id)){progress.seen.push(x.id);save();}return `<div class="row between"><span class=badge>${esc(x.type)} · ${state.pos+1}/${ids.length}</span><button data-go=start>学习顺序</button></div><div class=bar><i style="width:${100*(state.pos+1)/ids.length}%"></i></div><section class=card><div class=glyphbox><span class=type>先看这个单独的${esc(x.type)}</span><span class="thai glyph" lang=th>${esc(x.glyph)}</span></div><h2>${x.type==="辅音"?"字母名："+esc(x.name):esc(x.sound)}</h2>${x.type==="辅音"?`<p>记忆词：<b>${esc(x.mnemonic)}</b>。这只是字母名字的一部分，不是字母本身的词义。</p><p class=sound>起音：${esc(x.sound)}</p><p class=muted>名称索引：${esc(x.roman)}（Unicode 无声调转写，不能拿来拼词）。</p><button class=full data-say="${esc(x.speech)}" ${voice?"":"disabled"}>听字母名（本机合成）</button>${["ฃ","ฅ"].includes(x.id)?"<p class=flag>历史字母：本课供认形，旅行不必优先背。</p>":""}`:`<p>位置：${esc(x.position||"通常在字母上方")}。◌ 只是辅音位置占位，实际词里没有这个圈。</p>${x.example?`<p class=thai style="font-size:32px">${esc(x.example)}</p><p class=muted>这是位置示例；部分是练习音节，不要求当旅游词背。</p>`:""}`}
<h3>眼睛先看哪里</h3><p>${esc(x.hint)}</p><div class=compare><div><b>这次学</b><span class=thai lang=th>${esc(x.glyph)}</span></div><div><b>只作形状对照</b><span class=thai lang=th>${esc(o?o.glyph:x.other)}</span></div></div><p class=muted>观察法按带圈的常见印刷字设计。你的设备或真实店招可能换字体；圈的位置和长杆是线索，不是任何字体都适用的死规则。</p><details><summary>用手指描一遍轮廓（可选）</summary><p class=muted>沿灰字记形；不教笔顺、不自动判断写得对不对。</p><canvas id=trace width=600 height=240 aria-label="自由描形板"></canvas><button data-trace="${esc(x.glyph)}">显示／清空描形板</button></details>${linkSource(x.source)}</section><div class="row lesson-controls"><button class=grow data-prev ${state.pos===0?"disabled":""}>上一张</button><button class="primary grow" data-next-letter>${state.pos===ids.length-1?"遮住范字，测这一组":"看懂了，下一张"}</button></div><button class=full data-quiz>直接练已看过的字（不含未学字）</button>`;}
function startQuiz(){const ids=deckIds().filter(id=>progress.seen.includes(id));if(ids.length<2){app.insertAdjacentHTML("beforeend","<p class=note role=status>先至少看两张卡，再做没有范字的选择题。</p>");return;}const order=shuffle(ids);state.quiz={ids:order,i:0,options:[],selected:null,score:0,missed:[]};prepareQuiz();go("quiz");}
function prepareQuiz(){const q=state.quiz,target=q.ids[q.i];q.selected=null;q.options=shuffle([target,...shuffle(q.ids.filter(id=>id!==target)).slice(0,2)]);}
function renderQuiz(){const q=state.quiz;if(!q)return renderStart();if(q.i>=q.ids.length)return `<section class=card><h2>这一轮认字完成</h2><p class=sound>${q.score}/${q.ids.length} 首次选对</p><p>答后看过解释的题不会被记为“首次认出”。</p>${q.missed.length?`<h3>回看这几张</h3>${q.missed.map(id=>`<button data-item="${esc(id)}"><span class=thai>${esc(glyph(id))}</span> 回看</button>`).join(" ")}`:"<p>下一次可以换一组，或去逐字拼词。</p>"}<button class="primary full" data-quiz>重新打乱这一组</button><button class=full data-go=build>继续：把字母放回短词</button><button class=full data-go=start>返回学习顺序</button></section>`;const x=BY[q.ids[q.i]],answered=q.selected!==null,correct=q.selected===x.id;return `<span class=badge>无范字辨认 · ${q.i+1}/${q.ids.length}</span><section class=card><h2>${x.type==="辅音"?`找出记忆词是“${esc(x.mnemonic)}”的辅音`:`找出：${esc(x.sound.replace(/[\u0E00-\u0E7F◌]/g,""))}`}</h2><p>刚才已学过这些选项。先自己回想形状，不显示范字和罗马字答案。</p>${q.options.map(id=>`<button class=choice data-answer="${esc(id)}" ${answered?"disabled":""}><span class=thai lang=th>${esc(glyph(id))}</span></button>`).join("")}${answered?`<div class="${correct?"good":"wrong"}" role=status><b>${correct?"这次独立认对了":"这张需要再看"}</b><p><span class=thai style="font-size:40px">${esc(x.glyph)}</span> ${esc(x.hint)}</p></div><button class="primary full" data-quiz-next>下一题</button><button class=full data-item="${esc(x.id)}">回到这张字母讲解</button>`:""}</section>`;}
function answer(id){const q=state.quiz;if(!q||q.i>=q.ids.length||q.selected!==null||!q.options.includes(id))return;q.selected=id;const target=q.ids[q.i];if(id===target){q.score++;if(!progress.mastered.includes(id))progress.mastered.push(id);}else q.missed.push(target);save();render();}
function renderReference(){return `<section class=card><h2>44 个辅音，每个都能点开学</h2><p class=note>如果你刚开始，先去 <button data-go="families">声音家族</button>：同音字不需要靠耳朵硬猜具体拼写。</p><p>你不需要一次背完。每张都有放大字形、字母名、起音、观察位置和相似字对照。罕用的 ฃ、ฅ 已特别标出。</p><p class=note>本课的 h 表示“送气”：kh、ph、th 不是额外加一个 h 音节；th 也不是英语 think 的 th。字母名和词中的起音分开看。</p><div class=grid>${LETTERS.map(x=>`<button data-item="${x.id}"><span class=thai lang=th>${x.id}</span><small>${esc(x.mnemonic)}${["ฃ","ฅ"].includes(x.id)?" · 历史":""}${progress.mastered.includes(x.id)?" · 已认对":""}</small></button>`).join("")}</div>${linkSource(0)}<br>${linkSource(1)}</section>`;}
function renderSymbols(){return `<section class=card><h2>先区分“元音部件”和“上方记号”</h2><p>◌ 是空位示意，不是一个要读出的字母。先看位置，再看组合；一个发音可能要由前、后、上方多个部件一起表示。</p><div class=grid>${VOWELS.map(x=>`<button data-item="${x.id}"><span class=thai>${x.glyph}</span><small>${esc(x.position)} · ${esc(x.sound)}</small></button>`).join("")}</div></section><section class=card><h2>四个声调记号与另外两种符号</h2><p>有 5 种声调，但只有 4 个声调记号。没有上标也有声调；实际声调还取决于辅音类别、元音长短和字尾。本轮先认识符号，不要求背完整推算表。</p><div class=grid>${MARKS.map(x=>`<button data-item="${x.id}"><span class=thai>${x.glyph}</span><small>${esc(x.sound)}</small></button>`).join("")}</div>${linkSource(3)}</section>`;}
function renderBuild(){const w=WORDS[state.wi],missing=[...new Set(w.parts)].filter(id=>!progress.seen.includes(id));return `<div class="row between"><span class=badge>第 ${state.wi+1}/${WORDS.length} 个短词</span><button data-go=start>返回学习顺序</button></div><section class=card><h2>${state.building?"把学过的字放回位置：":"逐个拆开："}${esc(w.zh)}</h2>${missing.length&&!state.building?`<div class=note>这里还有 ${missing.length} 个你没看过的字，先点开学：<div class=parts>${missing.map(id=>`<button data-item="${esc(id)}"><span class=thai>${esc(glyph(id))}</span></button>`).join("")}</div>看完回来会保留这个词的位置。</div>`:""}${!state.building||state.buildHint?`<div class="word thai" lang=th>${esc(w.th)}</div><p class=sound>${esc(w.rom)}</p><div class=parts>${w.parts.map((id,i)=>`<div class=part><span class=thai>${esc(glyph(id))}</span><small>${i+1}. ${BY[id]?esc(BY[id].type):"部件"}</small></div>`).join("")}</div><div class=steps>${w.explain.map((text,i)=>`<p><b>${i+1}.</b> ${esc(text)}</p>`).join("")}</div><p class=note>${esc(w.rule)}</p><button class=full data-say="${esc(w.th)}" ${voice?"":"disabled"}>听完整短词（本机合成）</button>${linkSource(w.source)}`:""}${state.building?`<p>按<b>书写组成顺序</b>点选下方部件；这不等于逐个符号的发音顺序。</p><div class="slot thai" lang=th aria-label="已放入的部件">${esc(state.placed.map(i=>w.parts[i]).join(""))||"…"}</div><div class="row chips">${state.pool.map(i=>`<button data-piece="${i}" ${state.placed.includes(i)?"disabled":""}><span class=thai>${esc(glyph(w.parts[i]))}</span></button>`).join("")}</div>${state.buildFeedback?`<p class=${state.placed.length===w.parts.length?"good":"note"} role=status>${esc(state.buildFeedback)}</p>`:""}<button class=full data-build-hint>忘了就看讲解（记为借助提示）</button><button class=full data-build-reset>重新放一遍</button>`:`<button class="primary full" data-build-start>看懂了，遮住整词后试着组回去</button>`}</section><div class=row><button class=grow data-word-prev ${state.wi===0?"disabled":""}>上一个词</button><button class="primary grow" data-word-next ${state.wi===WORDS.length-1?"disabled":""}>下一个词</button></div>${state.wi===WORDS.length-1?`<section class=card><h2>现在再看标牌</h2><p class=thai style="font-size:32px">ทาง + เข้า → ทางเข้า<br>ทาง + ออก → ทางออก</p><p>遇到 ห้ามเข้า，先认禁止的 ห้าม；不可以只看到 เข้า 就当作入口。</p><a class="button primary full" href="./practice.html#signs">已有字母基础，继续标牌练习</a></section>`:""}<div class=parts>${WORDS.map((word,i)=>`<button data-word="${i}">${esc(word.zh)}${progress.built.includes(word.th)?" ✓":""}</button>`).join("")}</div>`;}
function resetBuild(){state.building=false;state.placed=[];state.pool=[];state.buildHint=false;state.buildFeedback="";}
function startBuild(){const w=WORDS[state.wi];state.building=true;state.placed=[];state.pool=shuffle(w.parts.map((_,i)=>i));state.buildHint=false;state.buildFeedback="";render();}
function place(i){const w=WORDS[state.wi];if(!state.building||!Number.isInteger(i)||i<0||i>=w.parts.length||state.placed.includes(i)||state.placed.length>=w.parts.length)return;const want=w.parts[state.placed.length];if(w.parts[i]!==want){state.buildFeedback="位置还不对。可以点“看讲解”，不需要靠反复猜。";render();return;}state.placed.push(i);state.buildFeedback="";if(state.placed.length===w.parts.length){state.buildFeedback=state.buildHint?"借助讲解完成组字。再回看整词读法；这不记作独立阅读通过。":"组成正确。再对照整词读法；组对部件不等于已会读所有陌生词。";if(!progress.built.includes(w.th))progress.built.push(w.th);save();}render();}
function renderSources(){return `<section class="card source"><h2>本课教到哪里</h2><p>先把 44 个辅音整理为 21 个词首声音家族，并显示高／中／低类别；再逐张学习字形。常用 20 个放在前面。另有 15 个元音部件、4 个声调记号、2 个其他符号，以及 ${WORDS.length} 个逐字讲解短词。</p><p>同一声音家族里的不同字形不要求靠听力互猜；高／中／低类也不等于固定声调。没有把“认字母”冒充“会读泰语”。复合元音、字尾变化和声调规则只用已核对例子说明，未制作通用拼音生成器。泰北话和真人语流不在这页的教学能力声明内。</p><p>名称索引用 Unicode 无声调转写；短词转写带声调提示。它们用途不同，不应把字母名逐个连读成单词。声音由设备本地标准泰语合成；未核听真人效果。</p><h3>可核对的原始资料</h3>${SOURCES.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener noreferrer">${esc(x[0])}</a>`).join("")}<p>观察字形的中文提示、练习顺序与互动为本课自行设计；不是转载的官方笔顺。设备字体、合成声音、真实街头字体辨认效果仍需你在实际设备上验证。</p></section>`;}
function trace(text){const c=document.getElementById("trace");if(!c)return;const ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);ctx.font='150px "Thonburi","Leelawadee UI","Garuda","Loma",Tahoma,sans-serif';ctx.textAlign="center";ctx.fillStyle="#c8d8ce";ctx.fillText(text,c.width/2,175);ctx.strokeStyle="#0f6854";ctx.lineWidth=5;ctx.lineCap="round";let down=false;const point=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));};c.onpointermove=e=>{if(down){ctx.lineTo(...point(e));ctx.stroke();}};c.onpointerup=c.onpointercancel=()=>{down=false;};}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;if(d.go){go(d.go);return;}if(d.deck!==undefined){openDeck(Number(d.deck));return;}if(d.item){openItem(d.item);return;}if(b.hasAttribute("data-prev")){state.pos=Math.max(0,state.pos-1);stop();render();window.scrollTo(0,0);return;}if(b.hasAttribute("data-next-letter")){if(state.pos<deckIds().length-1){state.pos++;stop();render();window.scrollTo(0,0);}else startQuiz();return;}if(b.hasAttribute("data-quiz")){startQuiz();return;}if(d.answer){answer(d.answer);return;}if(b.hasAttribute("data-quiz-next")){const q=state.quiz;if(q&&q.selected!==null){q.i++;if(q.i<q.ids.length)prepareQuiz();render();window.scrollTo(0,0);}return;}if(d.say){speak(d.say);return;}if(d.trace){trace(d.trace);return;}if(d.word!==undefined){state.wi=Number(d.word);resetBuild();go("build");return;}if(b.hasAttribute("data-word-prev")||b.hasAttribute("data-word-next")){state.wi=Math.max(0,Math.min(WORDS.length-1,state.wi+(b.hasAttribute("data-word-next")?1:-1)));resetBuild();go("build");return;}if(b.hasAttribute("data-build-start")||b.hasAttribute("data-build-reset")){startBuild();return;}if(b.hasAttribute("data-build-hint")){state.buildHint=true;render();return;}if(d.piece!==undefined)place(Number(d.piece));});
if(window.speechSynthesis)window.speechSynthesis.addEventListener("voiceschanged",refreshVoice);
render();
if((location.protocol==="https:"||["localhost","127.0.0.1"].includes(location.hostname))&&"serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(()=>navigator.serviceWorker.ready).then(()=>{document.getElementById("offline").textContent="离线组件已就绪；请在实际设备上开飞行模式验证三个页面。";}).catch(()=>{document.getElementById("offline").textContent="缓存尚未确认；请联网刷新后再测。";});}else if(location.protocol==="file:")document.getElementById("offline").textContent="单文件模式；语音和本机存储仍取决于浏览器。";
</script>
</body>
