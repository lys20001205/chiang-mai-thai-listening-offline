function searchRows(){let q=norm(state.query.trim());if(!q)return `<div class="panel"><h2>搜全部内容</h2><p>输入中文或罗马拼音的一部分，例如“押金”“mat jam”“不包括”。</p></div>`;let terms=q.split(/\s+/).filter(Boolean);const has=s=>terms.every(t=>norm(s).includes(t));let found=all.filter(x=>has(`${x.th} ${x.rom} ${x.zh} ${x.tip} ${lessons[x.lesson].title}`));let other=[];patterns.forEach(p=>{[p.formula,...p.examples].forEach(x=>{if(has(`${x.th} ${x.rom} ${x.zh} ${p.name}`))other.push({type:`句型 · ${p.name}`,text:tri(x,true)})})});dialect.forEach(pair=>pair.forEach(x=>{if(has(`${x.th} ${x.rom} ${x.zh}`)&&!found.some(y=>y.th===x.th))other.push({type:"泰北话对照",text:tri(x,true)})}));scams.forEach(x=>{if(has(`${x.name} ${x.cat} ${x.hear.th} ${x.hear.rom} ${x.hear.zh} ${x.truth} ${x.action}`))other.push({type:`防坑 · ${x.cat}`,text:`<b>${esc(x.name)}</b><p>${esc(x.truth)}</p>`})});prices.forEach(x=>{if(has(`${x.name} ${x.range} ${x.unit} ${x.note}`))other.push({type:"价格参照",text:`<b>${esc(x.name)}</b><p>${esc(x.range)} · ${esc(x.unit)}</p>`})});signs.forEach(x=>{if(has(`${x.cat} ${x.th} ${x.rom} ${x.zh} ${x.tip}`))other.push({type:`看字 · ${x.cat}`,text:`${tri(x,true)}<div class="tip">${esc(x.tip)}</div>`})});return `<div class="sectionhead"><h2>搜索结果</h2><span>${found.length+other.length} 条</span></div><p class="lead">匹配中文、泰文或罗马拼音；拼音可只输入一部分。</p>${found.map(x=>entryCard(x,true)).join("")}${other.map(x=>`<article class="result"><span class="pill">${esc(x.type)}</span>${x.text}</article>`).join("")}${found.length+other.length===0?`<div class="empty">没有找到。试试更短的中文或拼音，例如“押金”“mai”。</div>`:""}`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

  if(b.dataset.sceneChoice){state.sceneChoice=b.dataset.sceneChoice;if(state.sceneChoice===scenes[state.lesson].correct&&!progress.sceneDone.includes(state.lesson)){progress.sceneDone.push(state.lesson);save()}render();return}
  if(b.hasAttribute("data-recall-toggle")){state.recall=!state.recall;state.revealed=false;render();return}
  if(b.hasAttribute("data-reveal")){state.revealed=true;render();return}
  if(b.dataset.cardStep){state.card=Math.max(0,Math.min(lessons[state.lesson].cards.length-1,state.card+Number(b.dataset.cardStep)));state.revealed=false;render();return}
  if(b.dataset.mark){const id=b.dataset.mark;progress.learned=progress.learned.includes(id)?progress.learned.filter(x=>x!==id):[...progress.learned,id];save();render();return}
  if(b.dataset.triggerStep){state.trigger=Math.max(0,Math.min(triggers.length-1,state.trigger+Number(b.dataset.triggerStep)));render();return}
  if(b.dataset.trigger!==undefined){state.trigger=Number(b.dataset.trigger);render();return}
  if(b.dataset.filter){state.filter=b.dataset.filter;render();return}
  if(b.dataset.signCat){state.signCat=b.dataset.signCat;state.signPos=0;state.signRevealed=false;render();return}
  if(b.dataset.signStep){state.signPos=Math.max(0,Math.min(filteredSigns().length-1,state.signPos+Number(b.dataset.signStep)));state.signRevealed=false;render();return}
  if(b.dataset.signPos!==undefined){state.signPos=Number(b.dataset.signPos);state.signRevealed=false;render();return}
  if(b.hasAttribute("data-sign-practice")){state.signPractice=!state.signPractice;state.signRevealed=false;render();return}
  if(b.hasAttribute("data-sign-reveal")){state.signRevealed=true;render();return}
  if(b.dataset.signMark){const id=b.dataset.signMark;progress.signLearned=progress.signLearned.includes(id)?progress.signLearned.filter(x=>x!==id):[...progress.signLearned,id];save();render();return}
  if(b.hasAttribute("data-read-start")){const next=readingSteps.findIndex((_,i)=>!progress.readingDone.includes(i));state.readIndex=next<0?0:next;state.readChoice=null;state.readHint=false;go("readcoach");return}
  if(b.hasAttribute("data-read-restart")){state.readIndex=0;state.readChoice=null;state.readHint=false;render();window.scrollTo(0,0);return}
  if(b.dataset.readChoice!==undefined&&state.page==="readcoach"&&state.readIndex<readingSteps.length){if(state.readChoice===readingSteps[state.readIndex].answer)return;state.readChoice=b.dataset.readChoice;state.readHint=state.readChoice!==readingSteps[state.readIndex].answer;if(!state.readHint&&!progress.readingDone.includes(state.readIndex)){progress.readingDone.push(state.readIndex);save()}render();return}
  if(b.hasAttribute("data-read-hint")){state.readHint=true;render();return}
  if(b.hasAttribute("data-read-next")){state.readIndex=Math.min(readingSteps.length,state.readIndex+1);state.readChoice=null;state.readHint=false;render();window.scrollTo(0,0);return}
  if(b.hasAttribute("data-sign-quiz-start")){startSignQuiz();return}
  if(b.dataset.signChoice!==undefined&&state.signQuiz&&!state.signQuiz.done&&state.signQuiz.selected===null){const q=state.signQuiz,item=q.questions[q.index];q.selected=item.options[Number(b.dataset.signChoice)];if(q.selected===item.x.zh)q.score++;render();return}
  if(b.hasAttribute("data-sign-quiz-next")&&state.signQuiz){const q=state.signQuiz;q.index++;q.selected=null;if(q.index>=8){q.done=true;progress.signQuizScores.push({score:q.score,when:new Date().toLocaleString("zh-CN")});progress.signQuizScores=progress.signQuizScores.slice(-20);save()}render();window.scrollTo(0,0);return}
  if(b.hasAttribute("data-quiz-start")){startQuiz(b.dataset.quizStart);return}
  if(b.dataset.speak){playThai(b.dataset.speak,b.hasAttribute("data-slow"));return}
  if(b.hasAttribute("data-voice-refresh")){refreshThaiVoice();return}
  if(b.dataset.choice!==undefined&&state.quiz&&!state.quiz.done&&state.quiz.selected===null){const q=state.quiz,item=q.questions[q.index];q.selected=item.options[Number(b.dataset.choice)];if(q.selected===item.x.zh)q.score++;render();return}
  if(b.hasAttribute("data-quiz-next")&&state.quiz){state.quiz.index++;state.quiz.selected=null;if(state.quiz.index>=10){state.quiz.done=true;progress.quizScores.push({score:state.quiz.score,when:new Date().toLocaleString("zh-CN")});progress.quizScores=progress.quizScores.slice(-20);save()}render();window.scrollTo(0,0)}
});
search.addEventListener("input",()=>{state.query=search.value;state.page="search";render()});
back.addEventListener("click",()=>go(state.page==="lesson"?"lessons":state.page==="signquiz"||state.page==="readcoach"?"signs":"home"));
render();
if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
  window.speechSynthesis.addEventListener("voiceschanged",refreshThaiVoice);
  refreshThaiVoice();
}else{audioNote="此浏览器不支持泰语朗读。";render()}
if((location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")&&"serviceWorker" in navigator){
  const manifest=document.createElement("link");manifest.rel="manifest";manifest.href="./manifest.webmanifest";document.head.appendChild(manifest);
  if(!navigator.onLine&&navigator.serviceWorker.controller){offlineState="正在离线使用已缓存版本。";if(state.page==="home")render()}
  else navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineState="已缓存：现在可以开飞行模式试用。";if(state.page==="home")render()}).catch(()=>{offlineState=navigator.serviceWorker.controller?"正在使用已缓存版本；联网后可刷新更新。":"缓存未完成，请联网刷新后重试。";if(state.page==="home")render()});
}else if(location.protocol!=="file:"){
  offlineState="此浏览器未确认离线缓存；请用 iPhone Safari 打开 HTTPS 页面。";if(state.page==="home")render();
}
</script>
</body>
</html>
